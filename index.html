<!DOCTYPE html>

    <title>Harmony</title>
    <style>

            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ececec;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;

            object-fit: cover;
            border-radius: 12px;
        }

        h1 {

        }

        p {

            line-height: 1.45;
            color: #888888;
            margin-bottom: 28px;
        }

        .btn-tg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: #24A1DE;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 32px;
            transition: opacity 0.15s ease;
        }

        .btn-tg:hover {
            opacity: 0.85;
        }

        .tg-icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            display: block;
            pointer-events: none;
        }

        .footer {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }

        .footer a {
            color: #555555;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer a:hover {
            color: #999999;
        }
    </style>
</head>
